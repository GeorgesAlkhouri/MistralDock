services:
  mistraldock:
    build: .
    image: mistraldock:local
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
    volumes:
      - mistraldock-data:/data
    networks:
      - paperless

volumes:
  mistraldock-data:

networks:
  paperless:
    external: true
